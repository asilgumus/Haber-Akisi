<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Girişi — HaberAkışı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 text-slate-200 min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md">
    <!-- Logo -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold"><span class="text-white">Haber</span><span class="text-sky-400">Akışı</span></h1>
      <p class="text-slate-400 mt-2">Admin Paneli</p>
    </div>

    <!-- Login Form -->
    <div class="bg-slate-900/70 ring-1 ring-sky-500/30 rounded-3xl p-8">
      <h2 class="text-2xl font-bold mb-6 text-white text-center">Giriş Yap</h2>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mb-6 space-y-2">
            {% for category, message in messages %}
              <div class="bg-red-600/20 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg text-sm">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST" action="/admin/login" class="space-y-6">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-300 mb-2">
            Kullanıcı Adı
          </label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"
            placeholder="Kullanıcı adınızı girin"
          >
        </div>

        <div>
          <label for="password1" class="block text-sm font-medium text-slate-300 mb-2">
            İlk Şifre
          </label>
          <input 
            type="password" 
            id="password1" 
            name="password1" 
            required 
            class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"
            placeholder="İlk şifrenizi girin"
          >
        </div>

        <div>
          <label for="password2" class="block text-sm font-medium text-slate-300 mb-2">
            İkinci Şifre
          </label>
          <input 
            type="password" 
            id="password2" 
            name="password2" 
            required 
            class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"
            placeholder="İkinci şifrenizi girin"
          >
        </div>

        <button 
          type="submit" 
          class="w-full bg-sky-500 hover:bg-sky-400 text-white font-semibold py-3 px-6 rounded-lg transition"
        >
          Giriş Yap
        </button>
      </form>

      <div class="mt-6 text-center">
        <a href="/blog" class="text-slate-400 hover:text-sky-400 text-sm transition">
          ← Ana Sayfaya Dön
        </a>
      </div>
    </div>
  </div>

</body>
</html>
