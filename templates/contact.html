<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim — HaberAkışı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    
    /* Professional Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .animate-fadeInUp {
      animation: fadeInUp 0.4s ease-out;
    }
    
    .animate-slideInDown {
      animation: slideInDown 0.3s ease-out;
    }
    
    .hover-lift {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }
    
    .hover-glow:hover {
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 text-slate-200">

  <!-- Sticky Header -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur supports-[backdrop-filter]:bg-slate-900/70 border-b border-slate-800 animate-slideInDown">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/blog" class="text-2xl font-extrabold hover-glow"><span class="text-white">Haber</span><span class="text-sky-400">Akışı</span></a>
      <nav class="hidden md:flex items-center gap-6 text-sm font-semibold">
        <button onclick="window.location.href=document.referrer||window.history.back()" class="hover:text-sky-400 text-slate-300 transition-colors duration-200">Geri Dön</button>
        <!-- <a class="hover:text-sky-400 text-slate-300 transition-colors duration-200" href="/blog">Ana Sayfa</a> -->
        <a class="hover:text-sky-400 text-slate-300 transition-colors duration-200" href="/contact">İletişim</a>
        <a class="hover:text-sky-400 text-slate-300 transition-colors duration-200" href="/about">Hakkımızda</a>
      </nav>
    </div>
  </header>

  <!-- Contact Section -->
  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="max-w-4xl mx-auto">
      <!-- Header -->
      <div class="text-center mb-16 animate-fadeInUp">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-6 text-white">İletişim</h1>
        <p class="text-xl text-slate-300 max-w-2xl mx-auto">
          Sorularınız, önerileriniz veya işbirliği teklifleriniz için bizimle iletişime geçin.
        </p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
        <!-- Contact Form -->
        <div class="bg-slate-900/70 ring-1 ring-sky-500/30 rounded-3xl p-8 animate-fadeInUp stagger-1 hover-lift hover-glow">
          <h2 class="text-2xl font-bold mb-6 text-white">Mesaj Gönder</h2>
          <form id="contactForm" class="space-y-6" action="/contact" method="POST">
            <div class="animate-fadeInUp stagger-1">
              <label for="name" class="block text-sm font-medium text-slate-300 mb-2">Ad Soyad</label>
              <input type="text" id="name" name="name" required 
                     class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors duration-200">
            </div>
            <div class="animate-fadeInUp stagger-2">
              <label for="email" class="block text-sm font-medium text-slate-300 mb-2">E-posta</label>
              <input type="email" id="email" name="email" required 
                     class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors duration-200">
            </div>
            <div class="animate-fadeInUp stagger-3">
              <label for="subject" class="block text-sm font-medium text-slate-300 mb-2">Konu</label>
              <input type="text" id="subject" name="subject" required 
                     class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors duration-200">
            </div>
            <div class="animate-fadeInUp stagger-4">
              <label for="message" class="block text-sm font-medium text-slate-300 mb-2">Mesaj</label>
              <textarea id="message" name="message" rows="5" required 
                        class="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500 transition-colors duration-200"></textarea>
            </div>
            <button type="submit" 
                    class="w-full bg-sky-500 hover:bg-sky-400 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200">
              Mesaj Gönder
            </button>
          </form>
        </div>

        <!-- Contact Info -->
        <div class="space-y-8">
          <div class="bg-slate-900/70 ring-1 ring-sky-500/30 rounded-3xl p-8 animate-fadeInUp stagger-2 hover-lift hover-glow">
            <h3 class="text-xl font-bold mb-6 text-white">İletişim Bilgileri</h3>
            <div class="space-y-4">
              <div class="flex items-center gap-4 animate-fadeInUp stagger-1">
                <div class="w-12 h-12 bg-sky-500/20 rounded-lg flex items-center justify-center">
                  <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                  </svg>
                </div>
                <div>
                  <p class="text-slate-300">E-posta</p>
                  <p class="text-white font-medium">info@haberakisi.com</p>
                </div>
              </div>
              
              <div class="flex items-center gap-4 animate-fadeInUp stagger-2">
                <div class="w-12 h-12 bg-sky-500/20 rounded-lg flex items-center justify-center">
                  <svg class="w-6 h-6 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                  </svg>
                </div>
                <div>
                  <p class="text-slate-300">Adres</p>
                  <p class="text-white font-medium">İstanbul, Türkiye</p>
                </div>
              </div>
            </div>
          </div>

          <div class="bg-slate-900/70 ring-1 ring-sky-500/30 rounded-3xl p-8 animate-fadeInUp stagger-3 hover-lift hover-glow">
            <h3 class="text-xl font-bold mb-6 text-white">Sosyal Medya</h3>
            <div class="flex gap-4">
              <a href="#" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 rounded-lg flex items-center justify-center transition-colors duration-200">
                <svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/>
                </svg>
              </a>
              <a href="#" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 rounded-lg flex items-center justify-center transition-colors duration-200">
                <svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.03c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/>
                </svg>
              </a>
              <a href="#" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 rounded-lg flex items-center justify-center transition-colors duration-200">
                <svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 py-8 text-center text-sm text-slate-400">
    &copy; 2025 HaberAkışı. Tüm hakları saklıdır.
  </footer>

  <script>
    // Form submission is now handled by Flask backend
    // No need for preventDefault since we want the form to submit normally
  </script>
</body>
</html>
